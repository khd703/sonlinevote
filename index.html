<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>학교 캐릭터 공모전</title>
  <meta name="description" content="학생들이 그린 캐릭터에 하트와 댓글로 투표해 주세요." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23ff3b5c' d='M12 21s-7.5-4.6-10-9.3C.4 8.5 2.3 4 6.4 4c2.3 0 3.9 1.3 5.6 3.3C13.7 5.3 15.3 4 17.6 4 21.7 4 23.6 8.5 22 11.7 19.5 16.4 12 21 12 21z'/></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ================= 머리말: 사이트 제목 + 로그인 상태 ================= -->
  <header class="topbar">
    <h1 id="siteTitle" class="topbar__title">학교 캐릭터 공모전</h1>
    <div id="userArea" class="topbar__user">
      <!-- js/app.js 가 로그인 상태에 따라 버튼을 채움 -->
    </div>
  </header>

  <main class="page">
    <!-- 안내문 (관리자 화면에서 편집) -->
    <p id="notice" class="notice"></p>

    <!-- 투표 마감 안내 (마감일 때만 보임) -->
    <div id="closedBanner" class="banner" hidden>투표가 마감되었어요. 작품 감상과 댓글 읽기만 할 수 있어요.</div>

    <!-- 정렬 버튼 -->
    <nav class="sortbar" aria-label="정렬">
      <button class="sortbar__btn is-active" data-sort="random" type="button">랜덤</button>
      <button class="sortbar__btn" data-sort="popular" type="button">인기순</button>
      <button class="sortbar__btn" data-sort="latest" type="button">최신순</button>
    </nav>

    <!-- 작품 카드 목록 -->
    <section id="gallery" class="grid" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <a href="admin.html">관리자</a>
  </footer>

  <!-- ================= 작품 상세 모달 (이미지 · 하트 · 댓글) ================= -->
  <div id="detailModal" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <article class="modal__panel modal__panel--detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <button class="modal__close" type="button" data-close aria-label="닫기">×</button>
      <div class="detail__imgwrap">
        <img id="detailImg" class="detail__img" alt="" />
      </div>
      <div class="detail__body">
        <h2 id="detailTitle" class="detail__title"></h2>
        <p id="detailAuthor" class="detail__author"></p>

        <!-- 하트 영역: 투표 중이면 버튼, 마감이면 안내 문구 -->
        <div id="detailLikeArea" class="detail__like"></div>

        <p id="detailDesc" class="detail__desc"></p>

        <section class="comments">
          <h3 class="comments__head">댓글 <span id="commentCount">0</span></h3>
          <!-- 댓글 입력 (투표 중 + 로그인일 때) / 안내 문구 -->
          <div id="commentFormArea"></div>
          <ul id="commentList" class="comments__list"></ul>
        </section>
      </div>
    </article>
  </div>

  <!-- ================= 학생 로그인 모달 ================= -->
  <div id="loginModal" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <form id="loginForm" class="modal__panel modal__panel--login" role="dialog" aria-modal="true" aria-labelledby="loginTitle" novalidate>
      <button class="modal__close" type="button" data-close aria-label="닫기">×</button>
      <h2 id="loginTitle" class="login__title">투표 참여하기</h2>
      <p class="login__sub">학교, 학번, 이름을 입력하면 하트와 댓글을 남길 수 있어요.</p>

      <label class="field">
        <span class="field__label">학교명</span>
        <input id="inSchool" name="school" type="text" maxlength="40" autocomplete="organization" placeholder="예: 한빛고등학교" required />
      </label>
      <label class="field">
        <span class="field__label">학번</span>
        <input id="inNo" name="studentNo" type="text" maxlength="20" inputmode="numeric" placeholder="예: 10315" required />
      </label>
      <label class="field">
        <span class="field__label">이름</span>
        <input id="inName" name="name" type="text" maxlength="20" autocomplete="name" placeholder="예: 홍길동" required />
      </label>

      <!-- 개인정보 수집·이용 동의 -->
      <details class="consent">
        <summary>개인정보 수집·이용 안내 (펼쳐 보기)</summary>
        <ul>
          <li><b>수집 항목:</b> 학교명, 학번, 이름</li>
          <li><b>이용 목적:</b> 1인 1표 확인(중복 투표 방지), 댓글 작성자 표시(이름 일부 가림)</li>
          <li><b>보관 기간:</b> 공모전 결과 발표 후 지체 없이 삭제</li>
          <li>동의하지 않을 수 있으며, 동의하지 않으면 작품 보기만 가능합니다.</li>
        </ul>
      </details>
      <label class="check">
        <input id="inAgree" type="checkbox" required />
        <span>개인정보 수집·이용에 동의합니다.</span>
      </label>

      <p id="loginError" class="form-error" role="alert"></p>
      <button id="loginSubmit" class="btn btn--primary btn--block" type="submit">참여하기</button>
    </form>
  </div>

  <!-- 짧은 알림 메시지 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Supabase 라이브러리 (버전 고정) → 설정 → 앱 순서로 불러옴 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
